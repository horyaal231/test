name: lint

on:
  push:
    

jobs: 
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            statuses: write
            packages: read
        steps:
            - name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            - name: Super-linter
                uses: super-linter/super-linter@v7.3.0
                
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


